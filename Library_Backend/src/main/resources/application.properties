spring.config.import=optional:file:.env[.properties]
spring.application.name=library-management-system

server.port = 8090

spring.datasource.url = jdbc:mysql://localhost:3306/library_management_system
spring.datasource.username = ${SQL_USERNAME}
spring.datasource.password = ${SQL_PASSWORD}

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

spring.jpa.properties.hibernate.format_sql = true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

cors.allowed-origins=http://localhost:5173

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.mail.host = smtp.gmail.com
spring.mail.port = 587
spring.mail.username =${MAIL_USERNAME}
spring.mail.password = ${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth = true
spring.mail.properties.mail.smtp.starttls.enable = true
spring.mail.properties.mail.smtp.connectiontimeout = 5000
spring.mail.properties.mail.smtp.timeout = 5000
spring.mail.properties.mail.smtp.writetimeout = 5000

razorpay.callback.base-url=http://localhost:8090
razorpay.key.id = ${RAZORPAY_KEY_ID}
razorpay.key.secret = ${RAZORPAY_KEY_SECRET}

app.admin.email = ${ADMIN_EMAIL}
app.admin.password = ${ADMIN_PASSWORD}

server.error.include-stacktrace=never

# Fines
app.fines.overdue-per-day = 10
app.fines.damage-percentage = 50
app.fines.default-book-price = 500